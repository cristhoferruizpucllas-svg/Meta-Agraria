<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#176b45">
  <meta name="description" content="Meta-Agraria: plataforma académica para preparación universitaria.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>Meta-Agraria</title>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="brand-mark">🌱</div><div><strong>Meta-Agraria</strong><span>Tu meta, paso a paso</span></div></div>
    <button id="installBtn" class="install" hidden>Instalar app</button>
  </header>

  <main>
    <section class="hero">
      <div>
        <p class="eyebrow">UNALM · PREUNIVERSITARIO</p>
        <h1>Organiza tu preparación.</h1>
        <p class="hero-copy">Cursos, progreso y herramientas de estudio en un solo lugar.</p>
      </div>
      <div class="hero-icon">🌿</div>
    </section>

    <section class="stats">
      <div><b id="courseCount">0</b><span>Cursos</span></div>
      <div><b id="doneCount">0</b><span>Completados</span></div>
      <div><b id="progress">0%</b><span>Progreso</span></div>
    </section>

    <section class="section">
      <div class="section-title"><h2>Mis cursos</h2><button id="addCourse" class="text-btn">+ Añadir</button></div>
      <div id="courses" class="course-grid"></div>
    </section>

    <section class="section">
      <div class="section-title"><h2>Herramientas</h2></div>
      <div class="tools">
        <button class="tool" data-action="timer">⏱️<span>Cronómetro</span></button>
        <button class="tool" data-action="notes">📝<span>Notas rápidas</span></button>
        <button class="tool" data-action="plan">📚<span>Plan de estudio</span></button>
      </div>
    </section>
  </main>

  <nav class="bottom-nav"><button class="active">⌂<span>Inicio</span></button><button>📖<span>Cursos</span></button><button>⚙️<span>Ajustes</span></button></nav>

  <dialog id="courseDialog"><form method="dialog" id="courseForm"><h3>Nuevo curso</h3><input id="courseName" placeholder="Ej. Biología" maxlength="30" required><div class="dialog-actions"><button value="cancel">Cancelar</button><button id="saveCourse" class="primary" value="default">Guardar</button></div></form></dialog>
  <dialog id="toolDialog"><div id="toolContent"></div><button id="closeTool">Cerrar</button></dialog>

<script src="app.js"></script>
</body>
</html>
